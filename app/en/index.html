<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SwingSketch EN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><strong>SwingSketch EN</strong><span class="subtitle">Sketch your ideas</span></div><span id="status" role="status">Ready</span></header>
<nav aria-label="Drawing tools">
<div class="group"><button id="pen" class="active" aria-pressed="true">✎ Pen</button><button id="eraser" aria-pressed="false">Eraser</button></div>
<div class="group colors" aria-label="Colors">
<button class="color selected" data-color="#243447" style="--swatch:#243447" aria-label="Ink" aria-pressed="true"></button>
<button class="color" data-color="#ed5c66" style="--swatch:#ed5c66" aria-label="Coral" aria-pressed="false"></button>
<button class="color" data-color="#ee983d" style="--swatch:#ee983d" aria-label="Orange" aria-pressed="false"></button>
<button class="color" data-color="#e4c43b" style="--swatch:#e4c43b" aria-label="Yellow" aria-pressed="false"></button>
<button class="color" data-color="#409c77" style="--swatch:#409c77" aria-label="Green" aria-pressed="false"></button>
<button class="color" data-color="#3f85db" style="--swatch:#3f85db" aria-label="Blue" aria-pressed="false"></button>
<button class="color" data-color="#9164cf" style="--swatch:#9164cf" aria-label="Purple" aria-pressed="false"></button>
<button class="color" data-color="#dc80b6" style="--swatch:#dc80b6" aria-label="Pink" aria-pressed="false"></button>
</div>
<div class="group"><button data-size="4">Thin</button><button data-size="10" class="active">Medium</button><button data-size="24">Thick</button></div>
<div class="group"><button id="undo" disabled>↶ Undo</button><button id="redo" disabled>↷ Redo</button><button id="clear">Clear</button></div>
</nav>
<main><div id="paper"><canvas id="board" width="1600" height="900" aria-label="Canvas. Drag with a finger or mouse to draw."></canvas></div></main>
<footer><span>Draw with touch or a mouse. Use the remote to select tools.</span><span>Offline drawing board · 1.0</span></footer>
<div id="confirm" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title"><section><h2 id="confirm-title">Clear this drawing?</h2><p>You can undo this while the app remains open.</p><div class="group"><button id="cancelClear">Keep drawing</button><button id="confirmClear">Clear canvas</button></div></section></div>
<script src="app.js"></script>
</body></html>
